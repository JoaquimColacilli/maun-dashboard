<!doctype html>
<html lang="es-AR" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <script>
      try {
        var tema = localStorage.getItem('maun:tema');
        document.documentElement.dataset.theme =
          tema === 'light' || tema === 'dark' ? tema : 'system';
      } catch (error) {
        document.documentElement.dataset.theme = 'system';
      }
      var mesaForzada = { light: '#f2f1ed', dark: '#0b0b0b' }[
        document.documentElement.dataset.theme
      ];
      if (mesaForzada) {
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', mesaForzada);
        });
      }
      if (location.pathname.indexOf('/v/') === 0 || location.pathname.indexOf('/o/') === 0) {
        document.documentElement.dataset.vista = 'publica';
        document.addEventListener('DOMContentLoaded', function () {
          var manifiesto = document.querySelector('link[rel="manifest"]');
          if (manifiesto) manifiesto.remove();
        });
      }
    </script>
    <meta name="description" content="Finanzas y proyectos del taller MAUN." />
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>MAUN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
